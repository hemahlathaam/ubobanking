{% extends "base.html" %}

{% block title %}Notification settings — {{ org.name }}{% endblock %}

{% block content %}

<div class="page-heading">
    <div>
        <p class="page-label">SETTINGS</p>
        <h1>Notification settings</h1>
        <p>Email and SMS are local demo preferences; no external messages are sent.</p>
    </div>
</div>

<section class="professional-panel">

    <form method="post" class="professional-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label>
                <input type="checkbox" name="email_enabled" {% if preferences.email_enabled %}checked{% endif %}>
                Email alerts
            </label>
            <input name="email_address" type="email" placeholder="Email address"
                   value="{{ preferences.email_address }}">
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="sms_enabled" {% if preferences.sms_enabled %}checked{% endif %}>
                SMS alerts
            </label>
            <input name="phone_number" placeholder="Phone number"
                   value="{{ preferences.phone_number }}">
        </div>

        <button class="primary-bank-button" type="submit">Save preferences</button>
    </form>

</section>

{% endblock %}
